name: Publish to PyPI

# Builds platform wheels (+ sdist) for the `pynb-cli` distribution via maturin and
# publishes them.
#
# Trigger: workflow_dispatch -> pick TestPyPI (default) or PyPI.
#   * Use it directly for the first manual upload and for TestPyPI dry-runs.
#   * `release.yml` invokes it with `-f repository=pypi` after publishing a release,
#     so PyPI stays in lockstep with crates.io + GitHub Releases. A workflow_dispatch is
#     used rather than an `on: release` trigger because events emitted by the default
#     GITHUB_TOKEN do not start new workflow runs -- workflow_dispatch is the exception.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      dry_run:
        description: "Build wheels only (skip publishing + install smoke check)"
        type: boolean
        default: false
      ref:
        description: "Git ref (tag/branch/SHA) to build from. Empty = the ref this run was dispatched on."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          # glibc (manylinux) wheels -- the common case
          - target: x86_64
            manylinux: auto
            suffix: manylinux-x86_64
          - target: aarch64
            # manylinux2014 (glibc 2.17) headers predate AT_HWCAP2, so aws-lc-sys
            # (pulled in by reqwest's rustls default) fails to compile on aarch64.
            # 2_28 (AlmaLinux 8, glibc 2.28) has the modern headers. x86_64 stays on
            # 2014 for the widest reach.
            manylinux: "2_28"
            suffix: manylinux-aarch64
          # musl (Alpine / static) wheels -- mirrors the release.yml musl targets
          - target: x86_64
            manylinux: musllinux_1_2
            suffix: musllinux-x86_64
          - target: aarch64
            manylinux: musllinux_1_2
            suffix: musllinux-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: "true"
          # Keep native-tls/openssl: the vendored OpenSSL build (openssl-src) needs
          # several perl modules (IPC::Cmd, Time::Piece, ...) that the manylinux2014
          # (yum) image lacks; the musllinux/Alpine image only needs perl+make.
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-core perl-IPC-Cmd perl-Time-Piece perl-Data-Dumper
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache perl make
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.suffix }}
          path: dist

  macos:
    # Build both wheels on the Apple Silicon runner: it natively builds aarch64 and
    # cross-compiles x86_64. This avoids the macos-13 (Intel) runner, which GitHub is
    # retiring and which is frequently unavailable / stuck in the queue.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish (${{ inputs.repository }})
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: ${{ !inputs.dry_run }}
    # A GitHub Environment scopes the OIDC trusted-publisher configured on (Test)PyPI.
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write   # OIDC token for trusted publishing (no API token stored)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - name: Publish to PyPI
        if: ${{ inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI
        if: ${{ inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pipx-check:
    name: pipx install smoke check
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
      - name: Install the just-published pynb-cli and verify its version
        env:
          TARGET: ${{ inputs.repository }}
        run: |
          set -euxo pipefail
          # Pin to the version being published so this fails if the current run's upload
          # didn't land, instead of passing on some pre-existing release.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          echo "Expecting pynb-cli==$VERSION"
          if [ "$TARGET" = "testpypi" ]; then
            INDEX="https://test.pypi.org/simple/"
          else
            INDEX="https://pypi.org/simple/"
          fi
          # New releases can take a minute to appear on the index; retry a few times.
          for attempt in 1 2 3 4 5 6; do
            if python3 -m pipx install --index-url "$INDEX" "pynb-cli==$VERSION"; then
              break
            fi
            echo "pynb-cli==$VERSION not available yet (attempt $attempt), waiting 15s..."
            sleep 15
          done
          # The binary must run with NO Rust toolchain present, and report the pinned version.
          nb --version
          nb --version | grep -qw "$VERSION"
          nb --help | head -n 3
